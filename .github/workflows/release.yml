name: Release

# Push a tag such as v0.7.5.2 to publish a GitHub Release with the wheel, the
# sdist and standalone `colab` binaries for Linux, Windows and macOS (built
# with PyInstaller; no Python needed). The wheel is pure Python
# (py3-none-any), so one file installs on Linux, macOS and Windows:
#   uv tool install https://github.com/<owner>/<repo>/releases/download/vX.Y.Z/<wheel>
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # macOS sets UV_NO_CACHE (static OpenSSL), so there is no cache to
          # save; setup-uv v7 fails the job on that unless told it is fine.
          ignore-nothing-to-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check the version matches the tag
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          wheel=$(ls dist/*.whl)
          case "$wheel" in
            *"-${want}-"*) echo "wheel version $want matches the tag" ;;
            *) echo "wheel $wheel does not match tag $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  smoke:
    name: Install and run (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # No macOS here: hosted macOS arm64 runners are often unavailable
        # ("not acquired by Runner ... after multiple attempts"), and a
        # cancelled job marks the whole release run as failed even when the
        # release was published. ci.yml tests and installs the same
        # pure-Python wheel on macOS for every push to main.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # macOS sets UV_NO_CACHE (static OpenSSL), so there is no cache to
          # save; setup-uv v7 fails the job on that unless told it is fine.
          ignore-nothing-to-cache: true

      - name: Install the wheel in a clean environment and run it
        shell: bash
        run: |
          uv venv --python 3.12 smoke
          if [ "$RUNNER_OS" = "Windows" ]; then bin=smoke/Scripts; else bin=smoke/bin; fi
          uv pip install --python smoke dist/*.whl
          "$bin/colab" version | grep -F "${GITHUB_REF_NAME#v}"
          for cmd in secret hf clone forward share keepalive ssh exec run; do
            "$bin/colab" "$cmd" --help > /dev/null
          done

  binaries:
    name: Standalone binary (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          # Intel macOS: macOS arm64 runners are often unavailable; the x64
          # binary also runs on Apple silicon through Rosetta 2.
          - os: macos-15-intel
            label: macos-x64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          # macOS sets UV_NO_CACHE (static OpenSSL), so there is no cache to
          # save; setup-uv v7 fails the job on that unless told it is fine.
          ignore-nothing-to-cache: true

      # cryptography has no macOS x64 wheel, so uv builds it from source.
      # Linked dynamically, it needs Homebrew's libssl.3.dylib, but PyInstaller
      # bundles Python's older libssl.3.dylib of the same name, and the binary
      # fails with "Symbol not found: _SSL_get0_group_name". Link OpenSSL
      # statically instead, and skip the uv cache so no dynamically linked
      # build is reused.
      - name: Static OpenSSL for cryptography (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "UV_NO_CACHE=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked

      - name: cryptography must not link a libssl dylib (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          so=$(uv run python -c "import cryptography.hazmat.bindings._rust as m; print(m.__file__)")
          otool -L "$so"
          if otool -L "$so" | grep -q libssl; then echo "cryptography links libssl dynamically"; exit 1; fi

      - name: Build the colab binary with PyInstaller
        shell: bash
        run: |
          name="colab-${GITHUB_REF_NAME#v}-${{ matrix.label }}"
          uv run --with pyinstaller==6.22.3 python packaging/build_binary.py "$name"
          echo "BIN_NAME=$name" >> "$GITHUB_ENV"

      - name: Run the binary
        shell: bash
        run: |
          bin="dist/bin/$BIN_NAME"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" version | grep -F "${GITHUB_REF_NAME#v}"
          "$bin" readme | head -1 | grep -F "Colab CLI"
          for cmd in secret hf clone forward share keepalive ssh exec run stop; do
            "$bin" "$cmd" --help > /dev/null
          done

      - uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.label }}
          path: dist/bin/

  publish:
    name: Publish GitHub Release
    needs: [smoke, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No '## [$ver]' section in CHANGELOG.md; add one before tagging."
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
