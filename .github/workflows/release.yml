name: Release

# Push a tag such as v0.8.0 to publish a GitHub Release with the wheel and
# sdist. The wheel is pure Python (py3-none-any), so one file installs on
# Linux, macOS and Windows:
#   uv tool install https://github.com/<owner>/<repo>/releases/download/vX.Y.Z/<wheel>
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check the version matches the tag
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          wheel=$(ls dist/*.whl)
          case "$wheel" in
            *"-${want}-"*) echo "wheel version $want matches the tag" ;;
            *) echo "wheel $wheel does not match tag $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    name: Install and run (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install the wheel in a clean environment and run it
        shell: bash
        run: |
          uv venv --python 3.12 smoke
          if [ "$RUNNER_OS" = "Windows" ]; then bin=smoke/Scripts; else bin=smoke/bin; fi
          uv pip install --python smoke dist/*.whl
          "$bin/colab" version | grep -F "${GITHUB_REF_NAME#v}"
          for cmd in secret hf clone forward share keepalive ssh exec run; do
            "$bin/colab" "$cmd" --help > /dev/null
          done

  publish:
    name: Publish GitHub Release
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No '## [$ver]' section in CHANGELOG.md; add one before tagging."
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
