name: CI

# macOS runners are scarce (a few concurrent jobs per account), so avoid
# duplicate runs: branch pushes only (tags go to release.yml), no separate
# pull_request run (the push run's checks show on a PR from this repository).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (macOS 26 arm64) jobs often wait for a long time or are
        # cancelled ("not acquired by Runner"): GitHub reports capacity
        # constraints for macOS arm64 runners. macos-15-intel is a pinned GA
        # x64 image outside that pool; the code is pure Python.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python: ["3.12", "3.13"]
        exclude:
          # One Python version is enough on macOS; it saves a scarce runner.
          - os: macos-15-intel
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git tags.
          fetch-depth: 0

      # A fork has no release tags, which would make the version 0.1.devN.
      - name: Fetch upstream release tags
        shell: bash
        run: git fetch --tags --force https://github.com/googlecolab/google-colab-cli.git 'refs/tags/v*:refs/tags/v*'

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Unit tests
        run: uv run pytest tests/ -q

  build:
    name: Build and install (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream release tags
        shell: bash
        run: git fetch --tags --force https://github.com/googlecolab/google-colab-cli.git 'refs/tags/v*:refs/tags/v*'

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel in a clean environment and run it
        shell: bash
        run: |
          uv venv --python 3.12 smoke
          if [ "$RUNNER_OS" = "Windows" ]; then bin=smoke/Scripts; else bin=smoke/bin; fi
          # The venv directory works on every OS (Windows has python.exe).
          uv pip install --python smoke dist/*.whl
          "$bin/colab" version
          if "$bin/colab" version | grep -q "0\.1\.dev"; then echo "version 0.1.devN: release tags missing"; exit 1; fi
          "$bin/colab" --help > /dev/null
          for cmd in secret hf clone forward share keepalive ssh exec run; do
            "$bin/colab" "$cmd" --help > /dev/null
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  binary:
    name: Standalone binary (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream release tags
        shell: bash
        run: git fetch --tags --force https://github.com/googlecolab/google-colab-cli.git 'refs/tags/v*:refs/tags/v*'

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Same build as release.yml, so a broken binary shows up before a tag.
      - name: Build and run the colab binary
        shell: bash
        run: |
          uv sync --locked
          uv run --with pyinstaller==6.22.3 python packaging/build_binary.py colab
          bin=dist/bin/colab
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" version
          "$bin" readme | head -1 | grep -F "Colab CLI"
          for cmd in secret hf clone forward share keepalive ssh exec run stop; do
            "$bin" "$cmd" --help > /dev/null
          done
