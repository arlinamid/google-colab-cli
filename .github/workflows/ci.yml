name: CI

# Keep the load small. GitHub disabled Actions on this fork in November 2026,
# when every branch push started 11 jobs, three of them on macOS and three of
# them PyInstaller builds. Now:
# - push to any branch: lint and unit tests on Linux and Windows, Python 3.12
#   (2 jobs); nothing for changes to docs, Markdown or examples only;
# - pull request to main, when opened, reopened or marked ready: the full test
#   matrix with macOS, and a wheel install check (6 jobs); later pushes to the
#   PR branch run the 2 push jobs only;
# - manual run (Actions tab or `gh workflow run CI --ref BRANCH`): the full
#   matrix, plus the three standalone binaries with `-f binaries=true`. Run it
#   once before merging a release PR. Tags build the binaries in release.yml.
on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md", "examples/**"]
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md", "examples/**"]
  workflow_dispatch:
    inputs:
      binaries:
        description: "Also build and run the standalone binaries (3 jobs, one on macOS)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Push: Linux and Windows on 3.12. Pull request and manual runs: all
        # three OSes. macos-latest (macOS 26 arm64) jobs often wait for a long
        # time or are cancelled ("not acquired by Runner"): GitHub reports
        # capacity constraints for macOS arm64 runners. macos-15-intel is a
        # pinned GA x64 image outside that pool; the code is pure Python.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "macos-15-intel", "windows-latest"]') }}
        python: ${{ fromJSON(github.event_name == 'push' && '["3.12"]' || '["3.12", "3.13"]') }}
        exclude:
          # One Python version is enough on macOS; it saves a scarce runner.
          - os: macos-15-intel
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git tags.
          fetch-depth: 0

      # A fork has no release tags, which would make the version 0.1.devN.
      - name: Fetch upstream release tags
        shell: bash
        run: git fetch --tags --force https://github.com/googlecolab/google-colab-cli.git 'refs/tags/v*:refs/tags/v*'

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Unit tests
        run: uv run pytest tests/ -q

  build:
    # The wheel is pure Python: building and installing it on Linux is
    # enough here; release.yml also installs it on Windows.
    name: Build and install (${{ matrix.os }})
    if: github.event_name != 'push'
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream release tags
        shell: bash
        run: git fetch --tags --force https://github.com/googlecolab/google-colab-cli.git 'refs/tags/v*:refs/tags/v*'

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel in a clean environment and run it
        shell: bash
        run: |
          uv venv --python 3.12 smoke
          if [ "$RUNNER_OS" = "Windows" ]; then bin=smoke/Scripts; else bin=smoke/bin; fi
          # The venv directory works on every OS (Windows has python.exe).
          uv pip install --python smoke dist/*.whl
          "$bin/colab" version
          if "$bin/colab" version | grep -q "0\.1\.dev"; then echo "version 0.1.devN: release tags missing"; exit 1; fi
          "$bin/colab" --help > /dev/null
          for cmd in secret hf clone forward share keepalive ssh exec run; do
            "$bin/colab" "$cmd" --help > /dev/null
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  binary:
    # Only on request: `gh workflow run CI --ref BRANCH -f binaries=true`.
    name: Standalone binary (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.binaries
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream release tags
        shell: bash
        run: git fetch --tags --force https://github.com/googlecolab/google-colab-cli.git 'refs/tags/v*:refs/tags/v*'

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Same build as release.yml, so a broken binary shows up before a tag.
      # cryptography has no macOS x64 wheel, so uv builds it from source.
      # Linked dynamically, it needs Homebrew's libssl.3.dylib, but PyInstaller
      # bundles Python's older libssl.3.dylib of the same name, and the binary
      # fails with "Symbol not found: _SSL_get0_group_name". Link OpenSSL
      # statically instead, and skip the uv cache so no dynamically linked
      # build is reused.
      - name: Static OpenSSL for cryptography (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "UV_NO_CACHE=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked

      - name: cryptography must not link a libssl dylib (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          so=$(uv run python -c "import cryptography.hazmat.bindings._rust as m; print(m.__file__)")
          otool -L "$so"
          if otool -L "$so" | grep -q libssl; then echo "cryptography links libssl dynamically"; exit 1; fi

      - name: Build and run the colab binary
        shell: bash
        run: |
          uv run --with pyinstaller==6.22.3 python packaging/build_binary.py colab
          bin=dist/bin/colab
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" version
          "$bin" readme | head -1 | grep -F "Colab CLI"
          for cmd in secret hf clone forward share keepalive ssh exec run stop; do
            "$bin" "$cmd" --help > /dev/null
          done
